name: SiberKalkan APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Kodlari Al
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: APK Olustur
        run: |
          pip install flet pillow
          flet build apk --project "SiberKalkan" --org "org.tubitak" --permissions android.permission.READ_EXTERNAL_STORAGE android.permission.WRITE_EXTERNAL_STORAGE android.permission.READ_MEDIA_IMAGES android.permission.READ_MEDIA_VIDEO android.permission.READ_MEDIA_AUDIO

      - name: APK Yayinla
        uses: actions/upload-artifact@v4
        with:
          name: SiberKalkan-APK
          path: build/apk/*.apk


