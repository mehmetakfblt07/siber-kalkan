name: SiberKalkan APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Kodlari Al
        uses: actions/checkout@v4

      - name: APK Derle
        run: |
          buildozer -v android debug

      - name: APK Yayinla
        uses: actions/upload-artifact@v4
        with:
          name: SiberKalkan-APK
          path: bin/*.apk
