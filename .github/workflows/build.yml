name: SiberKalkan APK
on:
  push:
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: APK Derle
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Al
        uses: actions/checkout@v4

      - name: Flet Resmi Derleyici
        uses: ndonkoHenri/flet-github-action-workflows@v1
        with:
          build_cmd: "flet build apk --project SiberKalkan --org org.tubitak --permissions android.permission.READ_EXTERNAL_STORAGE android.permission.WRITE_EXTERNAL_STORAGE android.permission.READ_MEDIA_IMAGES android.permission.READ_MEDIA_VIDEO android.permission.READ_MEDIA_AUDIO"
          artifact_path: "build/apk"

      - name: APK Yayinla
        uses: actions/upload-artifact@v4
        with:
          name: SiberKalkan-APK
          path: build/apk/*.apk



