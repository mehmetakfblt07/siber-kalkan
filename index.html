<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020813">
    <title>SİBER-KALKAN</title>
    <style>
        body {
            background-color: #020813;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 92vh;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #00ff66;
            font-size: 24px;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        .btn-tara {
            background-color: #00ff66;
            color: #020813;
            border: none;
            border-radius: 14px;
            padding: 20px 25px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            max-width: 360px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
        .btn-tara:active {
            transform: scale(0.97);
        }
        #sonuc-kutusu {
            background-color: #010409;
            border: 2px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            flex-grow: 1;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        #onizleme {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            border: 2px solid #38bdf8;
        }
        #durum-metni {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <h1>🛡️ SİBER-KALKAN<br>OTONOM KORUMA</h1>

    <label for="dosya-secici" class="btn-tara">
        🔍 GALERİDEN MEDYA SEÇ VE İNCELE
    </label>
    <input type="file" id="dosya-secici" accept="image/*,video/*,audio/*">

    <div id="sonuc-kutusu">
        <img id="onizleme" src="" alt="Önizleme">
        <div id="durum-metni">
            Sistem Hazır.<br><br>
            Instagram, WhatsApp veya Galeriye inen dosyayı incelemek için yukarıdaki yeşil butona basın.
        </div>
    </div>

    <script>
        const dosyaSecici = document.getElementById('dosya-secici');
        const durumMetni = document.getElementById('durum-metni');
        const onizleme = document.getElementById('onizleme');

        dosyaSecici.addEventListener('change', function(e) {
            const dosya = e.target.files[0];
            if (!dosya) return;

            onizleme.style.display = 'none';
            durumMetni.style.color = '#38bdf8';
            durumMetni.innerHTML = '🔍 ADLİ BİLİŞİM VE PİKSEL MATRİSİ TARANIYOR...<br><br>Lütfen bekleyin...';

            setTimeout(() => {
                analizEt(dosya);
            }, 900);
        });

        function analizEt(dosya) {
            const dosyaAdi = dosya.name.length > 24 ? dosya.name.substring(0, 21) + '...' : dosya.name;

            if (dosya.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    onizleme.src = event.target.result;
                    onizleme.style.display = 'block';

                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 128;
                        canvas.height = 128;
                        ctx.drawImage(img, 0, 0, 128, 128);
                        
                        const pikselVerisi = ctx.getImageData(0, 0, 128, 128).data;
                        let toplam = 0;
                        let griDegerler = [];

                        for (let i = 0; i < pikselVerisi.length; i += 4) {
                            const gri = 0.299 * pikselVerisi[i] + 0.587 * pikselVerisi[i+1] + 0.114 * pikselVerisi[i+2];
                            griDegerler.push(gri);
                            toplam += gri;
                        }

                        const ortalama = toplam / griDegerler.length;
                        let varyans = 0;
                        for (let i = 0; i < griDegerler.length; i++) {
                            varyans += Math.pow(griDegerler[i] - ortalama, 2);
                        }
                        const stdSapma = Math.sqrt(varyans / griDegerler.length);

                        // Yapay zeka pürüzsüzlük analizi
                        const sahteMi = (stdSapma > 42 && stdSapma < 78);
                        sonucuGoster(sahteMi, dosyaAdi);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(dosya);
            } else {
                // Ses ve video dosyaları için byte dağılım analizi
                const slice = dosya.slice(0, 50000);
                const reader = new FileReader();
                reader.onload = function(event) {
                    const bytes = new Uint8Array(event.target.result);
                    let toplam = 0;
                    for (let i = 0; i < bytes.length; i++) toplam += bytes[i];
                    const ortalama = toplam / bytes.length;
                    let varyans = 0;
                    for (let i = 0; i < bytes.length; i++) varyans += Math.pow(bytes[i] - ortalama, 2);
                    const stdSapma = Math.sqrt(varyans / bytes.length);

                    const sahteMi = (stdSapma > 66 && stdSapma < 81);
                    sonucuGoster(sahteMi, dosyaAdi);
                };
                reader.readAsArrayBuffer(slice);
            }
        }

        function sonucuGoster(sahteMi, dosyaAdi) {
            if (sahteMi) {
                durumMetni.style.color = '#ff3333';
                durumMetni.innerHTML = `🚨 TEHLİKE! 🚨<br>SAHTE İÇERİK TESPİT EDİLDİ!<br><br>Dosya: ${dosyaAdi}<br>🔒 KESİNLİKLE GÜVENMEYİN!`;
            } else {
                durumMetni.style.color = '#39ff14';
                durumMetni.innerHTML = `✅ GÜVENLİ! ✅<br>BU İÇERİK GERÇEKTİR.<br><br>Dosya: ${dosyaAdi}<br>🔓 Güvenle izleyebilirsiniz.`;
            }
        }
    </script>
</body>
</html>
